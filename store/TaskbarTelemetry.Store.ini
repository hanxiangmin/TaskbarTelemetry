; TaskbarTelemetry Microsoft Store settings. Restart the app after editing.

[monitor]
refreshMilliseconds=1000

[ui]
width=528
horizontalOffset=0
verticalOffset=0
fontFamily=Microsoft YaHei UI
fontSize=8.5
foreground=Auto
background=Auto

[network]
; Empty means all active adapters that have a default gateway.
interfaceId=

[cpu]
; Empty means auto-detect a compact model name through Windows WMI.
alias=

[gpu]
alias0=GPU0
alias1=GPU1

[temperature]
; The Store build does not include the optional CPU-temperature backend.
enabled=false

[codex]
; local: scans only recent local event-file tails and retains quota numbers.
; appserver: official protocol only; requires a standalone Codex CLI.
; auto: app-server first, then local fallback. off: disable quota collection.
mode=local
command=codex
home=
refreshSeconds=1

[notification]
; Optional third-party quota alerts. Disabled until explicit in-app consent.
; The SendKey is protected with Windows DPAPI for the current user.
enabled=false
thresholdPercent=10
dailyRequestLimit=5
