; TaskbarTelemetry settings. Restart the app after editing.

[monitor]
refreshMilliseconds=1000

[ui]
width=520
; Compact layout: 520 physical pixels dual / 476 single, with hardware gutters.
; Set true only when intentionally opting into 96-DPI-based width enlargement.
scaleWidthWithDpi=false
horizontalOffset=0
verticalOffset=0
fontFamily=Microsoft YaHei UI
fontSize=8.5
foreground=Auto
background=Auto

[network]
; Empty means all active adapters that have a default gateway.
; To pin one adapter, paste its NetworkInterface.Id here.
interfaceId=

[cpu]
; Empty means auto-detect a compact model name through Windows WMI.
; Override must match 2-character family + '-' + at most 7 model characters.
; Examples: i7-14700KF / R9-9950X3D / U9-285K. CPU uses Consolas.
alias=

[gpu]
; Labels follow Windows Task Manager adapter order when Windows mapping is available.
alias0=GPU0
alias1=GPU1

[temperature]
; CPU temperature is optional until official PawnIO is installed once as administrator.
enabled=true
libreHardwareMonitorLibrary=lib\LibreHardwareMonitorLib.dll

[codex]
; local: scans recent Codex JSONL event lines and retains only quota numbers.
; appserver: official protocol only; locates the installed native Codex CLI.
; auto: app-server first, then local fallback. off: disable quota collection.
; This app never opens auth.json or stores an authentication token.
mode=auto
command=codex
home=
; Network quota reads: once per minute (60-240 s); no chat turn is started.
refreshSeconds=60
; Local event scan is independent; newly observed values appear within 1 s.
localRefreshSeconds=1

[notification]
; ServerChan 3 (sctp key): App; ServerChan Turbo (SCT key): WeChat/configured channels.
; The SendKey is protected with Windows DPAPI for the current user and is never stored here.
enabled=false
thresholdPercent=10
; Local daily request cap, including tests/retries. 0 disables the local cap, not provider limits.
dailyRequestLimit=5
